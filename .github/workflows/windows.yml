name: Windows preview build
on:
  push:
    branches: [windows]
    tags: ['windows-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - uses: compnerd/gha-setup-vsdevenv@f1ba60d553a3216ce1b89abe0201213536bc7557
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.block-exotic-subdeps=false
      - run: python -m pip install -r ../Server/requirements.txt
      - run: pnpm build:engine
      - run: pnpm test
      - run: pnpm test:runtime
      - run: pnpm test:shared
      - run: pnpm test:contracts
        env:
          PYTHON: python
      - run: python -B -m unittest discover -s ../Server
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/windows-v')
        with:
          name: windows-shared-runtime
          if-no-files-found: error
          retention-days: 1
          path: Windows/native/runtime/
  package:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: contracts
    # GitHub exposes draft releases only to tokens with repository push access.
    # This job uses that access to retrieve the approved, unpublished SDK input.
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/download-artifact@v4
        with:
          name: windows-shared-runtime
          path: Windows/native/runtime
      - uses: compnerd/gha-setup-vsdevenv@f1ba60d553a3216ce1b89abe0201213536bc7557
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.block-exotic-subdeps=false
      - run: node node_modules/electron/install.js
      - name: Compile Windows bridge with private vendor input
        run: ./scripts/prepare-native.ps1
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Package unsigned testing installer and portable app
        run: pnpm dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Include corresponding source and testing instructions
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "windows-v$version") { throw 'Tag and application version differ.' }
          git -C .. archive --format=zip --prefix="Mii-Plaza-Windows-$version-Source/" --output="Windows/dist/Plaza-Windows-$version-Source.zip" HEAD
          Copy-Item TESTING.md "dist/Windows-Testing-Readme.md"
          pnpm verify:package
      - name: Build disposable installed-update baseline
        run: node scripts/build-update-baseline.cjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test installed manual and automatic preview updates
        timeout-minutes: 8
        shell: pwsh
        run: |
          $installed = Join-Path $env:RUNNER_TEMP 'Plaza-Update-Test'
          $setup = (Resolve-Path 'update-baseline/Plaza-Update-Baseline.exe').Path
          $process = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$installed") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Could not install disposable updater baseline.' }
          $env:PLAZA_UPDATE_BASELINE = Join-Path $installed 'Plaza.exe'
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $env:PLAZA_UPDATE_INSTALLER = (Resolve-Path "dist/Plaza-Windows-$version-Setup-x64.exe").Path
          pnpm test:updates
          if ($LASTEXITCODE -ne 0) { throw 'Installed updater validation failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-update-evidence
          if-no-files-found: ignore
          path: |
            Windows/test-results/windows-update-install.json
            Windows/test-results/windows-update-ready.png
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            Windows/dist/*.exe
            Windows/dist/*.zip
            Windows/dist/*.sha256
            Windows/dist/windows-preview.json
            Windows/dist/windows-update-candidate.json
            Windows/dist/Windows-Testing-Readme.md
  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-preview
          path: windows-preview
      - name: Publish explicitly untested prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" windows-preview/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false --title "Plaza for Windows ${GITHUB_REF_NAME#windows-v} — UNTESTED preview" --notes-file Windows/TESTING.md

      - name: Explain the required local signed-feed publication
        shell: bash
        run: |
          echo '### Windows preview artifacts published' >> "$GITHUB_STEP_SUMMARY"
          echo 'Complete Windows/RELEASE-PROCESS.md on the existing signing Mac, then publish the Site. Source pushes do not deliver updates. No signing key is stored in GitHub.' >> "$GITHUB_STEP_SUMMARY"
