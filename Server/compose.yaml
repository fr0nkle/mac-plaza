services:
  plaza:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      PLAZA_BIND: 0.0.0.0
      PORT: "8787"
      PLAZA_DATABASE: /data/plaza.sqlite3
      PLAZA_UPDATES: /data/updates
      PLAZA_DOWNLOADS: /data/downloads
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - plaza-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  plaza-data:
