name: Windows port contract validation
# Manual validation only. This port is not connected to release publishing.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - uses: compnerd/gha-setup-vsdevenv@f1ba60d553a3216ce1b89abe0201213536bc7557
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.block-exotic-subdeps=false
      - run: python -m pip install -r ../Server/requirements.txt
      - run: pnpm build:engine
      - run: pnpm test
      - run: pnpm test:runtime
      - run: pnpm test:shared
      - run: pnpm test:contracts
        env:
          PYTHON: python
      - run: python -B -m unittest discover -s ../Server
# Desktop tests also require the licensed Discord SDK and native bridge.
# See Windows/BUILDING.md. No SDK, installer, or signing key is uploaded.
