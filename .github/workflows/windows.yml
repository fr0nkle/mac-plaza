name: Windows build and cross-platform notes
on:
  push:
    branches: [main, codex/windows-parity]
    paths: ['Windows/**', 'Sources/PlazaCore/**', 'Sources/MacPlaza/Resources/FFL/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Windows/**', 'Server/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.block-exotic-subdeps=false
      - run: node node_modules/electron/install.js
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        continue-on-error: true
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Resolve installed Swift paths
        shell: pwsh
        run: |
          $roots = @("$env:LOCALAPPDATA\Programs\Swift", "C:\Library\Developer", "C:\Program Files\Swift") | Where-Object { Test-Path $_ }
          $swift = $roots | ForEach-Object { Get-ChildItem $_ -Filter swift.exe -Recurse -ErrorAction SilentlyContinue } | Select-Object -First 1
          $sdk = $roots | ForEach-Object { Get-ChildItem $_ -Directory -Filter Windows.sdk -Recurse -ErrorAction SilentlyContinue } | Select-Object -First 1
          if (!$swift -or !$sdk) { throw 'Swift installer did not provide a complete toolchain and Windows SDK.' }
          $swift.DirectoryName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "SDKROOT=$($sdk.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: compnerd/gha-setup-vsdevenv@f1ba60d553a3216ce1b89abe0201213536bc7557
      - run: swift --version
      - run: ./scripts/prepare-native.ps1
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm run build:engine
      - run: pnpm test
      - run: python -m pip install -r ../Server/requirements.txt
      - run: python -B -m unittest discover -s ../Server
      - run: pnpm test:desktop
        env:
          PYTHON: python
      - run: pnpm test:parity
      - run: pnpm dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install and verify the Windows installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*Setup*.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'PlazaInstalled'
          $process = Start-Process $setup.FullName -ArgumentList @('/S', "/D=$target") -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path "$target/Plaza.exe")) { throw 'Windows installer failed.' }
          if ((Get-FileHash "$target/resources/app.asar").Hash -ne (Get-FileHash 'dist/win-unpacked/resources/app.asar').Hash) { throw 'Installed app differs from the ZIP payload.' }
          Get-ChildItem dist/win-unpacked/resources/native -File | ForEach-Object {
            if ((Get-FileHash $_.FullName).Hash -ne (Get-FileHash "$target/resources/native/$($_.Name)").Hash) { throw 'Installed native dependency differs from the ZIP payload.' }
          }
          "PLAZA_EXECUTABLE=$target\Plaza.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test the installed Windows executable
        run: pnpm test:desktop
        env:
          PYTHON: python
      - name: Test installed Windows parity
        run: pnpm test:parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-evidence
          path: Windows/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: windows-downloads
          path: |
            Windows/dist/*.exe
            Windows/dist/*.zip
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-downloads
          path: Windows/dist
      - name: Publish tested Windows preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./Windows/package.json').version")
          tag="windows-v$version"
          git archive --format=zip --prefix="Plaza-Windows-$version-Source/" -o "Windows/dist/Plaza-Windows-$version-Source.zip" HEAD Windows Server Sources/PlazaCore Sources/MacPlaza ThirdParty scripts/build-ffl.sh LICENSE LICENSING.md
          cd Windows/dist
          sha256sum *.exe *.zip > SHA256SUMS.txt
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace tested downloads.'
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Plaza for Windows $version — cross-platform preview" --notes-file ../../Windows/RELEASE-NOTES.md *.exe *.zip SHA256SUMS.txt
